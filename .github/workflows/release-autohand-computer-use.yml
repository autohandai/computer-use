name: Release Autohand Computer Use for macOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the notarized component revision
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  notarize:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test distribution contracts
        run: python3 -m unittest discover -s autohand/tests -p 'test_macos_*.py'
      - name: Read the pinned engine source
        id: engine
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path('autohand/macos-engine.json').read_text())
          sha = manifest['source_commit']
          assert manifest['source_kind'] == 'git' and re.fullmatch(r'[0-9a-f]{40}', sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.engine.outputs.sha }}
          path: engine-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine-source/libs/cua-driver/rust/target
          key: autohand-macos-engine-rust-1.97.1-${{ hashFiles('engine-source/libs/cua-driver/rust/Cargo.lock', 'engine-source/libs/cua-driver/rust/**/Cargo.toml') }}
      - name: Verify the pinned cursor wire contract
        working-directory: engine-source/libs/cua-driver/rust
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          cargo test --locked --release --target aarch64-apple-darwin -p cua-driver-core --lib mcp_result
          cargo test --locked --release --target aarch64-apple-darwin -p cua-driver-contract
          cargo test --locked --release --target aarch64-apple-darwin -p cua-driver-core --test contract_parity
          cargo run --locked --release --target aarch64-apple-darwin -p cua-driver-contract --bin cua-contract-gen -- all --check
      - name: Build the complete universal native engine from source
        run: |
          python3 autohand/scripts/build-macos-engine.py --source engine-source \
            --manifest autohand/macos-engine.json --output engine-input.tar.gz --receipt engine-build.json
      - name: Import Autohand Developer ID and notarization credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash autohand/scripts/import-apple-signing.sh
      - name: Sign and notarize the complete native distribution
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 autohand/scripts/sign-macos-distribution.py --engine-archive engine-input.tar.gz --build-receipt engine-build.json --output release
      - uses: actions/upload-artifact@v4
        with:
          name: autohand-computer-use-notarized-macos
          path: |
            engine-build.json
            release/*.tar.gz
            release/*.json
            release/checksums.txt
      - name: Publish an immutable signed revision
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("autohand/macos-engine.json"))["release_tag"])')
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::The signed revision already exists; choose a new immutable revision."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Autohand Computer Use — Apple notarized" \
            --notes 'Source-built native engine with the initial nullable-cursor correction from PR #2, Developer ID signatures and a stapled Autohand host. Exact engine source, build receipt and Apple submission ID are in provenance.json. macOS artifacts only.' \
            release/*.tar.gz release/provenance.json release/notarization.json release/checksums.txt
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/autohand-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/autohand-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/AutohandNotary.p8" "$RUNNER_TEMP/autohand-signing.p12"
